name: Upstream Action Scheduler compat

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Record upstream SHA
        run: echo "UPSTREAM_SHA=$(git ls-remote https://github.com/woocommerce/action-scheduler.git refs/heads/trunk | cut -f1)" >> "$GITHUB_ENV"

      - name: Override wp-env to use upstream trunk
        run: |
          cat > .wp-env.override.json <<'JSON'
          {
            "plugins": [
              "https://github.com/woocommerce/action-scheduler.git",
              "."
            ]
          }
          JSON

      - name: composer install
        run: composer install --no-interaction --no-progress

      - name: Start wp-env
        run: npx @wordpress/env start

      - name: Run PHPUnit (in wp-env)
        run: composer test:env

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.UPSTREAM_SHA || 'unknown';
            const short = sha.slice(0, 7);
            const title = `Upstream compat: action-scheduler trunk @ ${short} breaks tests`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Daily upstream-compat run failed.`,
              ``,
              `- Upstream SHA: \`${sha}\``,
              `- Workflow run: ${runUrl}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-compat',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Still failing on ${new Date().toISOString().slice(0,10)} — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-compat', 'bug'],
              });
            }
